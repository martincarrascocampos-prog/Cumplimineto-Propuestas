<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPT · Secretaría de Participación</title>
<meta name="description" content="Sistema de Planificación de Trabajo de la Secretaría de Participación: proyectos, pasos, encargados, rankings y calendario, conectado al programa FECh 2026.">
<link rel="stylesheet" href="estilos.css">
</head>
<body>

<header class="top">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <span>
      <b>SPT · Participación</b>
      <span>Sistema de Planificación de Trabajo</span>
    </span>
  </div>
  <div class="top-actions">
    <a class="salto" href="index.html">← Conectómetro</a>
    <span class="conexion" id="conexion" title="Dónde se están guardando los datos"><i></i><span>…</span></span>
  </div>
</header>

<nav class="tabs" role="tablist" aria-label="Módulos" id="modulos">
  <button class="tab" role="tab" data-vista="tablero" aria-selected="true">Tablero</button>
  <button class="tab" role="tab" data-vista="panel" aria-selected="false">Panel</button>
  <button class="tab" role="tab" data-vista="proyectos" aria-selected="false">Proyectos</button>
  <button class="tab" role="tab" data-vista="calendario" aria-selected="false">Calendario</button>
  <button class="tab" role="tab" data-vista="pizarra" data-icono="pizarra" aria-selected="false">Pizarra</button>
  <button class="tab" role="tab" data-vista="equipo" aria-selected="false">Equipo</button>
</nav>

<div class="migas" id="migas" aria-label="Dónde estoy"></div>

<section class="filters" id="filtros">
  <label class="field"><span>Estado</span><select id="f-estado"></select></label>
  <label class="field"><span>Urgencia</span><select id="f-urgencia"></select></label>
  <label class="field"><span>Origen</span><select id="f-origen"></select></label>
  <label class="field"><span>Encargado</span><select id="f-persona"></select></label>
  <label class="field grow"><span>Buscar</span><input type="search" id="f-texto" placeholder="Proyecto o paso"></label>
  <button class="btn btn-ghost" id="f-limpiar">Limpiar</button>
</section>

<main id="vista"></main>
<div id="tt" class="tt" hidden></div>
<footer>SPT v3.1 · Secretaría de Participación — FECh 2026</footer>

<script src="config.js" onerror="void 0"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="core.js"></script>
<script src="data.js"></script>
<script src="spt-data.js"></script>
<script src="spt.js"></script>
</body>
</html>
